<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
    <style>
      .p{fill:#EEF3F8;stroke:#1F4E79;stroke-width:1.2}
      .pg{fill:#E8F5EF;stroke:#1B7F5E;stroke-width:1.6}
      .px{fill:#F6F6F6;stroke:#8A8A8A;stroke-width:1.2;stroke-dasharray:5 3}
      .pc{fill:#FFF7E6;stroke:#B7791F;stroke-width:1.2}
      .pt{font-size:13px;font-weight:600;fill:#1A1A1A;text-anchor:middle}
      .life{stroke:#9AA5B1;stroke-width:1;stroke-dasharray:4 4}
      .msg{stroke:#44546A;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .ret{stroke:#44546A;stroke-width:1.3;fill:none;marker-end:url(#a);stroke-dasharray:5 3}
      .mt{font-size:12px;fill:#1A1A1A;text-anchor:middle}
      .n{font-size:11px;fill:#1F4E79;font-weight:600}
      .note{fill:#FFFBEA;stroke:#C9A227;stroke-width:1}
      .nt{font-size:12px;fill:#3A3A3A}
      .hl{fill:#E8F5EF}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- highlight of the part the customer sees live -->
  <rect x="20" y="552" width="1160" height="140" rx="6" class="hl"/>
  <text x="30" y="570" class="nt" fill="#1B6B50" font-weight="600">Moduł zaimplementowany</text>

  <!-- participants: x = 90 260 430 600 770 940 1110 -->
  <rect x="25" y="20" width="130" height="46" rx="7" class="pc"/><text x="90" y="48" class="pt">Klient</text>
  <rect x="195" y="20" width="130" height="46" rx="7" class="p"/><text x="260" y="40" class="pt">Checkout</text><text x="260" y="56" class="pt">i zamówienia</text>
  <rect x="365" y="20" width="130" height="46" rx="7" class="px"/><text x="430" y="48" class="pt">PSP</text>
  <rect x="535" y="20" width="130" height="46" rx="7" class="p"/><text x="600" y="48" class="pt">Fulfillment</text>
  <rect x="705" y="20" width="130" height="46" rx="7" class="pc"/><text x="770" y="48" class="pt">Apteka</text>
  <rect x="875" y="20" width="130" height="46" rx="7" class="p"/><text x="940" y="40" class="pt">Dispatch</text><text x="940" y="56" class="pt">+ kurier</text>
  <rect x="1045" y="20" width="130" height="46" rx="7" class="pg"/><text x="1110" y="48" class="pt">Tracking</text>

  <line x1="90" y1="66" x2="90" y2="760" class="life"/>
  <line x1="260" y1="66" x2="260" y2="760" class="life"/>
  <line x1="430" y1="66" x2="430" y2="760" class="life"/>
  <line x1="600" y1="66" x2="600" y2="760" class="life"/>
  <line x1="770" y1="66" x2="770" y2="760" class="life"/>
  <line x1="940" y1="66" x2="940" y2="760" class="life"/>
  <line x1="1110" y1="66" x2="1110" y2="760" class="life"/>

  <!-- 1 -->
  <text x="175" y="100" class="mt">1. Złóż zamówienie (Idempotency-Key)</text>
  <line x1="90" y1="108" x2="258" y2="108" class="msg"/>
  <!-- 2 -->
  <text x="345" y="140" class="mt">2. Preautoryzacja kwoty</text>
  <line x1="260" y1="148" x2="428" y2="148" class="msg"/>
  <!-- 3 -->
  <text x="345" y="180" class="mt">3. Webhook: autoryzowano</text>
  <line x1="430" y1="188" x2="262" y2="188" class="ret"/>
  <!-- 4 -->
  <text x="430" y="220" class="mt">4. OrderAuthorized → wybierz aptekę</text>
  <line x1="260" y1="228" x2="598" y2="228" class="msg"/>
  <!-- 5 -->
  <text x="685" y="260" class="mt">5. Rezerwacja + oferta (SLA 3 min)</text>
  <line x1="600" y1="268" x2="768" y2="268" class="msg"/>
  <!-- 6 -->
  <text x="685" y="300" class="mt">6. Akceptacja w panelu</text>
  <line x1="770" y1="308" x2="602" y2="308" class="ret"/>
  <!-- 7 -->
  <text x="430" y="340" class="mt">7. PharmacyAccepted</text>
  <line x1="600" y1="348" x2="262" y2="348" class="msg"/>
  <text x="855" y="340" class="mt">7a. PharmacyAssigned (nazwa, adres)</text>
  <line x1="600" y1="348" x2="1108" y2="348" class="msg"/>
  <!-- 8 -->
  <text x="345" y="380" class="mt">8. Capture</text>
  <line x1="260" y1="388" x2="428" y2="388" class="msg"/>
  <!-- 9 -->
  <text x="175" y="420" class="mt">9. „Twoje zamówienie</text>
  <text x="175" y="434" class="mt">kompletuje Apteka X”</text>
  <line x1="260" y1="442" x2="92" y2="442" class="ret"/>
  <!-- 10 -->
  <text x="770" y="474" class="mt">10. Zleć kuriera na czas gotowości paczki</text>
  <line x1="600" y1="482" x2="938" y2="482" class="msg"/>
  <!-- 11 -->
  <text x="855" y="514" class="mt">11. Odbiór: skan paczki</text>
  <line x1="940" y1="522" x2="772" y2="522" class="ret"/>

  <!-- tracking part -->
  <text x="1025" y="596" class="mt">12. ParcelPickedUp</text>
  <line x1="940" y1="604" x2="1108" y2="604" class="msg"/>
  <text x="1025" y="632" class="mt">13. Pozycje GPS (batch)</text>
  <line x1="940" y1="640" x2="1108" y2="640" class="msg"/>
  <text x="600" y="668" class="mt">14. Strumień SSE: apteka, trasa, pozycja, postęp, ETA</text>
  <line x1="1110" y1="676" x2="92" y2="676" class="ret"/>

  <!-- 15 -->
  <text x="685" y="720" class="mt">15. CourierArrived → doręczenie potwierdzone kodem → Delivered</text>
  <line x1="1110" y1="728" x2="262" y2="728" class="msg"/>

  <!-- notes -->
  <rect x="440" y="140" width="0" height="0"/>
  <rect x="850" y="232" width="330" height="80" rx="6" class="note"/>
  <text x="860" y="252" class="nt">Odrzucenie / brak odpowiedzi w 3 min:</text>
  <text x="860" y="270" class="nt">zwolnij rezerwację → kolejna apteka (maks. 3).</text>
  <text x="860" y="288" class="nt">Brak apteki: anuluj zamówienie</text>
  <text x="860" y="304" class="nt">i zwolnij preautoryzację (void, nie zwrot).</text>
</svg>
