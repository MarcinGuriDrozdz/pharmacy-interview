<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
    <style>
      .s{fill:#EEF3F8;stroke:#1F4E79;stroke-width:1.2}
      .sg{fill:#E8F5EF;stroke:#1B7F5E;stroke-width:1.6}
      .sr{fill:#FDECEC;stroke:#B03A2E;stroke-width:1.2}
      .t{font-size:12.5px;fill:#1A1A1A;text-anchor:middle}
      .tb{font-size:12.5px;font-weight:600;fill:#1A1A1A;text-anchor:middle}
      .c{font-size:10.5px;fill:#55606E;text-anchor:middle}
      .ln{stroke:#44546A;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lr{stroke:#B03A2E;stroke-width:1.3;fill:none;marker-end:url(#a);stroke-dasharray:5 3}
      .l{font-size:10.5px;fill:#44546A;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#FFFFFF"/>

  <!-- x: 20, 185, 350, 515, 680, 845, 1010 ; w=150 -->
  <rect x="20" y="60" width="150" height="62" rx="30" class="s"/><text x="95" y="87" class="tb">PendingPayment</text><text x="95" y="104" class="c">czeka na PSP</text>
  <rect x="185" y="60" width="150" height="62" rx="30" class="s"/><text x="260" y="87" class="tb">Sourcing</text><text x="260" y="104" class="c">„szukamy apteki”</text>
  <rect x="350" y="60" width="150" height="62" rx="30" class="s"/><text x="425" y="87" class="tb">Accepted</text><text x="425" y="104" class="c">apteka znana klientowi</text>
  <rect x="515" y="60" width="150" height="62" rx="30" class="s"/><text x="590" y="87" class="tb">ReadyForPickup</text><text x="590" y="104" class="c">paczka czeka</text>
  <rect x="680" y="60" width="150" height="62" rx="30" class="sg"/><text x="755" y="87" class="tb">InDelivery</text><text x="755" y="104" class="c">śledzenie na żywo</text>
  <rect x="845" y="60" width="150" height="62" rx="30" class="sg"/><text x="920" y="87" class="tb">Arrived</text><text x="920" y="104" class="c">kurier pod adresem</text>
  <rect x="1010" y="60" width="150" height="62" rx="30" class="s"/><text x="1085" y="87" class="tb">Delivered</text><text x="1085" y="104" class="c">kod odbioru OK</text>

  <line x1="170" y1="91" x2="183" y2="91" class="ln"/>
  <line x1="335" y1="91" x2="348" y2="91" class="ln"/>
  <line x1="500" y1="91" x2="513" y2="91" class="ln"/>
  <line x1="665" y1="91" x2="678" y2="91" class="ln"/>
  <line x1="830" y1="91" x2="843" y2="91" class="ln"/>
  <line x1="995" y1="91" x2="1008" y2="91" class="ln"/>

  <text x="95" y="44" class="l">preautoryzacja OK →</text>
  <text x="425" y="44" class="l">capture</text>
  <text x="755" y="44" class="l">ParcelPickedUp</text>

  <!-- retry loop on Sourcing -->
  <path d="M 230 60 C 230 20, 290 20, 290 58" class="ln"/>
  <text x="260" y="16" class="l">odrzucenie / timeout → następna apteka</text>

  <!-- cancel -->
  <rect x="185" y="210" width="315" height="58" rx="29" class="sr"/>
  <text x="342" y="235" class="tb">Cancelled</text><text x="342" y="252" class="c">void preautoryzacji albo zwrot, zwolnienie rezerwacji</text>
  <path d="M 95 122 L 95 239 L 183 239" class="lr"/>
  <text x="150" y="180" class="l">płatność odrzucona</text>
  <line x1="260" y1="122" x2="260" y2="208" class="lr"/>
  <text x="300" y="165" class="l">brak apteki</text>
  <line x1="425" y1="122" x2="425" y2="208" class="lr"/>
  <text x="470" y="165" class="l">klient anuluje</text>
  <path d="M 590 122 L 590 239 L 502 239" class="lr"/>
  <text x="665" y="180" class="l">nie da się wydać</text>
  <text x="665" y="194" class="l">(po próbie innej apteki)</text>
  <text x="920" y="160" class="c">po odbiorze nie zmieniamy apteki;</text>
  <text x="920" y="176" class="c">problem w drodze = obsługa zgłoszenia</text>
</svg>
