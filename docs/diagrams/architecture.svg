<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546A"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#1A1A1A;text-anchor:middle}
      .s{font-size:11px;fill:#55606E;text-anchor:middle}
      .h{font-size:14px;font-weight:600;fill:#1F4E79}
      .hg{font-size:14px;font-weight:600;fill:#1B6B50}
      .l{font-size:11px;fill:#44546A}
      .m{fill:#FFFFFF;stroke:#1F4E79;stroke-width:1.2}
      .g{fill:#FFFFFF;stroke:#1B7F5E;stroke-width:1.6}
      .x{fill:#F6F6F6;stroke:#8A8A8A;stroke-width:1.2;stroke-dasharray:5 3}
      .c{fill:#FFF7E6;stroke:#B7791F;stroke-width:1.2}
      .i{fill:#F2F2F2;stroke:#6B6B6B;stroke-width:1.2}
      .ln{stroke:#44546A;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lb{stroke:#44546A;stroke-width:1.4;fill:none;marker-end:url(#a);marker-start:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="740" fill="#FFFFFF"/>

  <!-- clients -->
  <text x="120" y="30" class="t" font-weight="600">Klienci systemu</text>
  <rect x="30" y="70" width="180" height="64" rx="8" class="c"/>
  <text x="120" y="98" class="t">Aplikacja klienta</text><text x="120" y="116" class="s">web / iOS / Android</text>
  <rect x="30" y="300" width="180" height="64" rx="8" class="c"/>
  <text x="120" y="328" class="t">Aplikacja kuriera</text><text x="120" y="346" class="s">GPS, odbiór, doręczenie</text>
  <rect x="30" y="520" width="180" height="64" rx="8" class="c"/>
  <text x="120" y="548" class="t">Panel apteki</text><text x="120" y="566" class="s">tablet: akceptacja, kompletacja</text>

  <!-- gateway -->
  <rect x="255" y="60" width="120" height="540" rx="8" class="m"/>
  <text x="315" y="300" class="t" font-weight="600">API Gateway</text>
  <text x="315" y="318" class="s">BFF, JWT,</text><text x="315" y="332" class="s">rate limiting</text>
  <line x1="210" y1="102" x2="253" y2="102" class="ln"/>
  <line x1="210" y1="332" x2="253" y2="332" class="ln"/>
  <line x1="210" y1="552" x2="253" y2="552" class="ln"/>

  <!-- monolith -->
  <rect x="420" y="40" width="400" height="390" rx="10" fill="#EEF3F8" stroke="#1F4E79" stroke-width="1.4"/>
  <text x="436" y="64" class="h">Platforma zamówień — modularny monolit (.NET)</text>
  <rect x="440" y="80" width="175" height="62" rx="7" class="m"/><text x="527" y="106" class="t">Koszyk</text><text x="527" y="124" class="s">walidacja, limity, ceny</text>
  <rect x="625" y="80" width="175" height="62" rx="7" class="m"/><text x="712" y="106" class="t">Katalog i dostępność</text><text x="712" y="124" class="s">OTC, indeks stanów</text>
  <rect x="440" y="156" width="175" height="62" rx="7" class="m"/><text x="527" y="182" class="t">Checkout i zamówienia</text><text x="527" y="200" class="s">saga, stany, idempotencja</text>
  <rect x="625" y="156" width="175" height="62" rx="7" class="m"/><text x="712" y="182" class="t">Płatności</text><text x="712" y="200" class="s">adapter PSP, webhooki</text>
  <rect x="440" y="232" width="175" height="62" rx="7" class="m"/><text x="527" y="258" class="t">Fulfillment</text><text x="527" y="276" class="s">wybór apteki, rezerwacja</text>
  <rect x="625" y="232" width="175" height="62" rx="7" class="m"/><text x="712" y="258" class="t">Dispatch</text><text x="712" y="276" class="s">przydział kuriera</text>
  <rect x="440" y="308" width="175" height="62" rx="7" class="m"/><text x="527" y="334" class="t">Apteki</text><text x="527" y="352" class="s">godziny, pojemność, panel</text>
  <rect x="625" y="308" width="175" height="62" rx="7" class="m"/><text x="712" y="334" class="t">Powiadomienia</text><text x="712" y="352" class="s">push, SMS, e-mail</text>
  <text x="620" y="415" class="s">zdarzenia przez outbox → broker; osobny schemat bazy na moduł</text>

  <!-- tracking -->
  <rect x="420" y="455" width="400" height="145" rx="10" fill="#E8F5EF" stroke="#1B7F5E" stroke-width="1.8"/>
  <text x="436" y="479" class="hg">Delivery Tracking — osobny serwis (zaimplementowany)</text>
  <rect x="440" y="495" width="112" height="62" rx="7" class="g"/><text x="496" y="521" class="t">Ingest</text><text x="496" y="539" class="s">batch pozycji</text>
  <rect x="564" y="495" width="112" height="62" rx="7" class="g"/><text x="620" y="521" class="t">Procesor</text><text x="620" y="539" class="s">1 writer / dostawa</text>
  <rect x="688" y="495" width="112" height="62" rx="7" class="g"/><text x="744" y="521" class="t">Read model</text><text x="744" y="539" class="s">+ strumień SSE</text>
  <line x1="552" y1="526" x2="562" y2="526" class="ln"/>
  <line x1="676" y1="526" x2="686" y2="526" class="ln"/>
  <text x="620" y="585" class="s">inny profil obciążenia: ~250 zapisów/s, tysiące otwartych strumieni</text>

  <line x1="375" y1="200" x2="418" y2="200" class="lb"/>
  <text x="397" y="192" class="l" text-anchor="middle">REST</text>
  <line x1="375" y1="526" x2="418" y2="526" class="lb"/>
  <text x="397" y="518" class="l" text-anchor="middle">REST/SSE</text>

  <!-- infra -->
  <rect x="420" y="640" width="125" height="64" rx="8" class="i"/><text x="482" y="667" class="t">PostgreSQL</text><text x="482" y="685" class="s">+ PostGIS</text>
  <rect x="557" y="640" width="125" height="64" rx="8" class="i"/><text x="619" y="667" class="t">Redis</text><text x="619" y="685" class="s">stan dostaw, pub/sub</text>
  <rect x="694" y="640" width="126" height="64" rx="8" class="i"/><text x="757" y="667" class="t">Broker</text><text x="757" y="685" class="s">Service Bus + Kafka</text>
  <line x1="620" y1="600" x2="620" y2="638" class="lb"/><line x1="757" y1="600" x2="757" y2="638" class="lb"/>
  <path d="M 822 400 L 860 400 L 860 672 L 822 672" class="lb"/>

  <!-- external -->
  <text x="1030" y="30" class="t" font-weight="600">Systemy zewnętrzne</text>
  <rect x="930" y="157" width="200" height="60" rx="8" class="x"/><text x="1030" y="183" class="t">Operator płatności (PSP)</text><text x="1030" y="201" class="s">BLIK, karty — preautoryzacja</text>
  <rect x="930" y="81" width="200" height="60" rx="8" class="x"/><text x="1030" y="107" class="t">Systemy apteczne</text><text x="1030" y="125" class="s">feed stanów magazynowych</text>
  <rect x="930" y="309" width="200" height="60" rx="8" class="x"/><text x="1030" y="335" class="t">FCM / APNs / SMS</text><text x="1030" y="353" class="s">push do aplikacji</text>
  <rect x="930" y="496" width="200" height="60" rx="8" class="x"/><text x="1030" y="522" class="t">Dostawca map</text><text x="1030" y="540" class="s">geokodowanie, routing, ETA</text>

  <line x1="800" y1="187" x2="928" y2="187" class="lb"/>
  <line x1="928" y1="111" x2="802" y2="111" class="ln"/>
  <line x1="800" y1="339" x2="928" y2="339" class="ln"/>
  <line x1="820" y1="526" x2="928" y2="526" class="lb"/>
</svg>
